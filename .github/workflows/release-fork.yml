name: Release plugin
on:
  push:
    branches: [main]
    paths-ignore: ['pluginmaster.json']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact source SHA; empty uses the workflow commit
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: plugin-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'kaldigo/FFXIVAetherform'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
      DEFAULT_BRANCH: main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source receipt
        shell: pwsh
        run: git merge-base --is-ancestor $env:SOURCE_COMMIT origin/main
      - name: Plan immutable release version
        id: plan
        uses: kaldigo/DalamudPlugins/.github/actions/plan-release@b8b369ec2b8f45efa2a8eabb094b13226bc815b9
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          internal-name: Aetherform
          minimum-version: '0.3.0.1'
          source-commit: ${{ inputs.source_commit || github.sha }}
          tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - name: Build and test exact source
        if: steps.plan.outputs.skip != 'true'
        uses: ./.github/actions/build
        with:
          release-version: ${{ steps.plan.outputs.version }}
      - name: Package and validate
        if: steps.plan.outputs.skip != 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          python tools/package_feed.py $env:RELEASE_TAG
      - name: Publish verified assets and source feed
        uses: kaldigo/DalamudPlugins/.github/actions/publish-release@b8b369ec2b8f45efa2a8eabb094b13226bc815b9
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          default-branch: main
